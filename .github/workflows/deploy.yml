name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ hashFiles('requirements.txt') }}
          path: ~/.cache/pip
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs
        # --strict fails the build on broken links or pages missing from the nav,
        # so command-reference drift is caught here rather than shipping silently.
        run: mkdocs build --strict

      - name: Index site with Pagefind
        # Site search (docs/assets/js/pagefind-search.js) needs the
        # /pagefind/ bundle this generates inside site/ - without it the
        # search box renders but silently returns zero results in
        # production. See scripts/Serve-WithSearch.ps1 for the local
        # equivalent of this step.
        run: npx --yes pagefind --site site

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
