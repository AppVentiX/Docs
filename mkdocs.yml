site_name: AppVentiX Documentation
site_description: Technical documentation for AppVentiX - Modern Workspace Control for Microsoft environments
site_url: https://docs.appventix.com
site_author: AppVentiX

repo_url: https://github.com/AppVentiX/Docs
repo_name: AppVentiX/Docs
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.png
  favicon: assets/images/favicon.ico
  language: en
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - assets/css/appventix.css
  - assets/css/pagefind-search.css

extra_javascript:
  - assets/js/pagefind-search.js

hooks:
  - hooks.py

extra:
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/AppVentiX
      name: AppVentiX on X
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/appventix
      name: AppVentiX on LinkedIn
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@appventix
      name: AppVentiX on YouTube
  homepage: https://appventix.com

copyright: Copyright &copy; AppVentiX

plugins:
  - search:
      lang: en
      # Extends Material's default separator with backslash/forward slash so
      # Windows paths and registry keys (e.g. AppData\Roaming\AppVentiX) split
      # into searchable words instead of indexing as one long token.
      separator: '[\s\-,:!=\[\]()"/\\]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)'
  # Generates the categorized command-reference nav (_nav.md) from the
  # 'category' front matter stamped by scripts/Build-CommandReference.ps1.
  - gen-files:
      scripts:
        - scripts/gen_nav.py
  - literate-nav:
      nav_file: _nav.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets

nav:
  - Home: index.md
  - Quickstart:
    - quickstart/index.md
    - 1. Central View Installation: quickstart/appventix-central-view-installation.md
    - 2. Create Machine Group(s): quickstart/create-machine-groups.md
    - 3. Install AppVentiX Agent: quickstart/agent-installation.md
    - 4. Verify the Agent: quickstart/verify-agent.md
    - (Optional) Optimize the Workspace: quickstart/optimization-script.md
  - Admin Guide:
