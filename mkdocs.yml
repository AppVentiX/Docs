site_name: AppVentiX Documentation
site_description: Technical documentation for AppVentiX - Modern Workspace Control for Microsoft environments
site_url: https://docs.appventix.com
site_author: AppVentiX

repo_url: https://github.com/AppVentiX/Docs
repo_name: AppVentiX/Docs
edit_uri: ""

theme:
  name: material
  logo: assets/images/logo.png
  favicon: assets/images/favicon.ico
  language: en
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - assets/css/appventix.css

extra:
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/AppVentiX
      name: AppVentiX on X
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/appventix
      name: AppVentiX on LinkedIn
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@appventix
      name: AppVentiX on YouTube
  homepage: https://appventix.com

copyright: Copyright &copy; AppVentiX

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets

